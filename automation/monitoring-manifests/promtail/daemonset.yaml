apiVersion: apps/v1
kind: DaemonSet

metadata:
  name: promtail
  namespace: hrms

spec:

  selector:

    matchLabels:

      app: promtail

  template:

    metadata:

      labels:

        app: promtail

    spec:

      containers:

      - name: promtail

        image: grafana/promtail:latest

        args:

        - -config.file=/etc/promtail/promtail.yaml

        volumeMounts:

        - name: varlog

          mountPath: /var/log

      volumes:

      - name: varlog

        hostPath:

          path: /var/log
